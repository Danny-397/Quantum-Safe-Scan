# Render Blueprint — one-click deploy of the QuantumSafe API + database.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: quantumsafe-api
    runtime: python
    plan: free
    # Install the shared scanner package (repo root) AND the backend deps.
    buildCommand: "pip install -e . && pip install -r backend/requirements.txt"
    # --timeout 120 so a repo clone+scan isn't killed by the default 30s limit.
    startCommand: "cd backend && gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Pin Python so the build is reproducible (avoids a newer default breaking
      # psycopg2/other wheels).
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      # Set this in the Render dashboard to an EXTERNAL Postgres (Neon, Supabase,
      # or a paid Render instance).
      #
      # It used to be `fromDatabase: quantumsafe-db`, pointing at a Render free
      # Postgres. Render deletes those after 90 days; once it was gone the
      # blueprint could no longer resolve the reference, so the service stopped
      # starting altogether — the whole API was unreachable rather than merely
      # storage-less. Tradeski supplies DATABASE_URL this way and has stayed up.
      #
      # Left unset the app falls back to SQLite (see backend/config.py): accounts
      # and scan history don't survive a redeploy, but the service boots and
      # anonymous scanning — the part the public site actually uses — works.
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false        # set to your Vercel dashboard URL
      - key: DASHBOARD_URL
        sync: false
      - key: API_URL
        sync: false        # set to this service's public URL
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "true"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false

