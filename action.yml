name: "QuantumSafe Scanner"
description: "Scan a codebase for quantum-vulnerable cryptography and upload SARIF to code scanning."
author: "QuantumSafe"
branding:
  icon: "shield"
  color: "blue"

inputs:
  path:
    description: "Directory to scan."
    required: false
    default: "."
  output:
    description: "SARIF output file."
    required: false
    default: "quantumsafe.sarif"
  exclude:
    description: "Comma-separated glob(s) of paths to skip (e.g. tests/*,vendor/*)."
    required: false
    default: ""
  fail-on-high:
    description: "Fail the job if any HIGH-risk finding is present."
    required: false
    default: "false"
  baseline:
    description: >-
      Path to a committed JSON report to compare this scan against. Prints
      what was fixed, what is new and what is unchanged. If the file is
      missing the job warns and skips the comparison rather than failing, so
      a first run still works.
    required: false
    default: ""
  fail-on-new:
    description: >-
      With `baseline`, fail the job only when the scan finds something NEW.
      Lets an existing backlog be tolerated while stopping it from growing --
      which `fail-on-high` cannot do without failing every build from day one.
    required: false
    default: "false"
  version:
    description: "Version of quantumsafe-scan to install (e.g. 0.2.0). Default: latest."
    required: false
    default: ""

outputs:
  sarif-file:
    description: "Path to the SARIF report produced by the scan."
    value: "${{ inputs.output }}"

runs:
  using: "composite"
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install quantumsafe-scan
      shell: bash
      env:
        QS_VERSION: ${{ inputs.version }}
      run: |
        if [ -n "$QS_VERSION" ]; then
          pip install "quantumsafe-scan==$QS_VERSION"
        else
          pip install quantumsafe-scan
        fi

    - name: Run QuantumSafe scan
      shell: bash
      # Inputs go through the environment rather than being interpolated into
      # the script: a ${{ }} expansion inside `run` is a shell-injection vector
      # if a caller passes a crafted value.
      env:
        QS_PATH: ${{ inputs.path }}
        QS_OUTPUT: ${{ inputs.output }}
        QS_EXCLUDE: ${{ inputs.exclude }}
        QS_FAIL_ON_HIGH: ${{ inputs.fail-on-high }}
        QS_BASELINE: ${{ inputs.baseline }}
        QS_FAIL_ON_NEW: ${{ inputs.fail-on-new }}
      run: |
        args=(scan --path "$QS_PATH" --output "$QS_OUTPUT")
        if [ "$QS_FAIL_ON_HIGH" = "true" ]; then
          args+=(--fail-on-high)
        fi
        if [ -n "$QS_BASELINE" ]; then
          if [ -f "$QS_BASELINE" ]; then
            args+=(--baseline "$QS_BASELINE")
            if [ "$QS_FAIL_ON_NEW" = "true" ]; then
              args+=(--fail-on-new)
            fi
          else
            # Warn loudly but carry on: on a first run the baseline has not
            # been committed yet, and failing there would be unhelpful. The
            # annotation makes the skipped comparison visible rather than
            # silent.
            echo "::warning::baseline '$QS_BASELINE' not found; skipping the comparison. Commit a baseline with: quantumsafe scan --path . --output $QS_BASELINE"
          fi
        elif [ "$QS_FAIL_ON_NEW" = "true" ]; then
          echo "::warning::fail-on-new needs a baseline; ignoring it."
        fi
        if [ -n "$QS_EXCLUDE" ]; then
          IFS=',' read -ra globs <<< "$QS_EXCLUDE"
          for g in "${globs[@]}"; do
            g="$(echo "$g" | xargs)"          # trim surrounding whitespace
            [ -n "$g" ] && args+=(--exclude "$g")
          done
        fi
        quantumsafe "${args[@]}"
