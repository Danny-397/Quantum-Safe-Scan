name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r backend/requirements.txt
          pip install -r requirements-dev.txt

      - name: Run test suite
        run: pytest -q

      # Every "N tests" in the README and the technical report is a claim a
      # reader can check by cloning and running pytest, so a stale one is a
      # published inaccuracy rather than a cosmetic slip. Keeping them current
      # by hand did not work: the shields badge spells the number differently
      # from the prose, so searching for one does not find the other.
      - name: Check the documented test counts
        run: python tools/check_test_count.py
