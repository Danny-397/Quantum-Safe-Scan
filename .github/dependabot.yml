# Keeps the pinned deploy requirements current without a PR per package:
# one grouped PR a month, plus an immediate PR whenever a pin has a known
# vulnerability (security updates ignore the schedule and the grouping).
version: 2
updates:
  - package-ecosystem: pip
    directory: "/backend"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      deploy-requirements:
        patterns: ["*"]
